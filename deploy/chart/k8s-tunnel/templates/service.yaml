# Headless Service required by the StatefulSet. It gives the pods stable
# names; clients do not connect through it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-tunnel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-tunnel.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "k8s-tunnel.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-tunnel
      port: {{ .Values.server.port }}
      targetPort: tunnel
      protocol: TCP
